name: C/C++ CI

on:
  push:
    branches: [ "unicorn" ]
  pull_request:
    branches: [ "unicorn" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install htslib
      run: sudo apt-get update && sudo apt-get install -y libhts-dev
    -name: Update submodules
      run: git submodule update --init --recursive
    - name: make
      run: make

