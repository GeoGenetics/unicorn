name: C/C++ CI

on:
  push:
    branches: [ "dev", "unicorn" ]
  pull_request:
    branches: [ "dev", "unicorn" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Install htslib
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y libhts-dev
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install htslib
          fi
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev zlib1g-dev liblzma-dev libcurl4-openssl-dev
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: make
        run: make
      - name: test
        run: make test  

